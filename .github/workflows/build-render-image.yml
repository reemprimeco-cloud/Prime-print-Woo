# Build the print-file render service (binder-render-service) as a container
# image and publish it, private, to this repository's GitHub package registry:
#
#   ghcr.io/reemprimeco-cloud/binder-render-service:latest
#
# The Synology NAS (or any Docker host) only pulls and runs it; nothing is
# built there. Built for Intel/AMD and ARM, so it runs on any NAS model that
# has Container Manager.
#
# The ICC profile is not kept in the repository (git-ignored); the build fetches
# ECI's free "ISO Coated v2 300%" (FOGRA39) from eci.org, as SPEC.md asks for
# production.
#
# Runs on a push to main-0t9dg8 that touches the service, the editor (whose
# print page the service serves), the shared code, or this file; or by hand
# from the Actions tab.
name: Build render service image

on:
  push:
    branches: [main-0t9dg8]
    paths:
      - binder-render-service/**
      - binder-editor/**
      - binder-shared/**
      - .github/workflows/build-render-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-render-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/reemprimeco-cloud/binder-render-service

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the ECI FOGRA39 colour profile
        run: |
          set -u
          mkdir -p binder-render-service/assets/icc /tmp/eci
          out=binder-render-service/assets/icc/FOGRA39.icc
          UA='Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          pick() { find /tmp/eci -type f -iname 'ISOcoated_v2_300_eci.icc' | head -n 1; }

          # 1) ECI's own download (blocks plain curl, so look like a browser).
          for url in \
            https://www.eci.org/_media/downloads/icc_profiles_from_eci/eci_offset_2009.zip \
            https://eci.org/_media/downloads/icc_profiles_from_eci/eci_offset_2009.zip; do
            if curl -fsSL -A "$UA" -e https://www.eci.org/en/downloads -o /tmp/eci/eci.zip "$url" \
               && unzip -q -o /tmp/eci/eci.zip -d /tmp/eci/zip 2>/dev/null; then
              break
            fi
            echo "::warning::$url did not give a zip: $(file -b /tmp/eci/eci.zip 2>/dev/null)"
            head -c 300 /tmp/eci/eci.zip 2>/dev/null || true; echo
          done

          # 2) Ubuntu's icc-profiles package carries the same ECI profiles.
          if [ -z "$(pick)" ]; then
            sudo sed -i 's/^Components: main restricted$/Components: main restricted universe multiverse/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            sudo apt-get update -qq || true
            (cd /tmp/eci && apt-get download icc-profiles 2>&1 | tail -n 2 || true)
            for deb in /tmp/eci/icc-profiles_*.deb; do [ -f "$deb" ] && dpkg-deb -x "$deb" /tmp/eci/deb || true; done
          fi

          icc=$(pick)
          if [ -z "$icc" ]; then
            echo "::error::ISOcoated_v2_300_eci.icc (FOGRA39) not found in any source"
            find /tmp/eci -iname '*.ic[cm]' | head -n 40
            exit 1
          fi
          echo "Using $icc"
          cp "$icc" "$out"
          # An ICC profile has the signature "acsp" at byte 36.
          [ "$(dd if="$out" bs=1 skip=36 count=4 2>/dev/null)" = "acsp" ] || { echo "::error::$out is not an ICC profile"; exit 1; }
          ls -l binder-render-service/assets/icc

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for this machine and check it starts healthy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: binder-render-service/Dockerfile
          platforms: linux/amd64
          load: true
          tags: render-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Health check (Chromium, Ghostscript, ICC profile, print page)
        run: |
          docker run -d --name rs -p 8787:8787 -e NODE_ENV=development render-test:ci
          for i in $(seq 1 30); do
            if out=$(curl -fsS http://127.0.0.1:8787/healthz 2>/dev/null); then break; fi
            sleep 2
          done
          echo "healthz: $out"
          docker logs rs | tail -n 20
          echo "$out" | grep -q '"ghostscript":true' || { echo "::error::Ghostscript missing"; exit 1; }
          echo "$out" | grep -q '"icc_profile":true' || { echo "::error::ICC profile missing"; exit 1; }
          echo "$out" | grep -q '"print_page":true' || { echo "::error::print page missing"; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Intel and ARM and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: binder-render-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
